server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # React Router uses client-side routing — any path that isn't a real
    # static file falls back to index.html so deep links (e.g.
    # /complaints/<uuid>) work on a hard refresh instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get long-lived caching; index.html deliberately
    # doesn't (it references the current hashed asset filenames, so it
    # must always be revalidated).
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
