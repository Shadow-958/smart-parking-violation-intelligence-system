name: CI

# Runs the dependency-free test suites built up across Modules 2-7:
# backend/tests (mocked-DB and pure-function tests) and ai_models/tests
# (fully dependency-free — no spaCy/xgboost/ultralytics needed). Does
# NOT run anything requiring a live Postgres+PostGIS instance, spaCy/
# NLTK model downloads, or network access to Nominatim — those need a
# real environment to verify, not CI.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend unit tests
        run: PYTHONPATH=. pytest tests -v
        working-directory: backend

      - name: Run ai_models unit tests
        run: PYTHONPATH=. pytest ai_models/tests -v

      - name: Syntax-check every Python file (including ones needing heavy ML deps CI doesn't install)
        run: python -m py_compile $(find backend ai_models datasets -name "*.py" -not -path "*/node_modules/*")
